services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 5005
      POSTGRES_URL: ${POSTGRES_URL:?POSTGRES_URL is required}
      POSTGRES_USERNAME: ${POSTGRES_USERNAME:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DATABASE: ${POSTGRES_DATABASE:-}
      POSTGRES_SSL: ${POSTGRES_SSL:-false}
      POSTGRES_SSL_REJECT_UNAUTHORIZED: ${POSTGRES_SSL_REJECT_UNAUTHORIZED:-false}
      SECRETS_ENCRYPTION_KEY_BASE64: ${SECRETS_ENCRYPTION_KEY_BASE64:-}
      AUTH_TOKEN_KEY_BASE64: ${AUTH_TOKEN_KEY_BASE64:-}
      LOCAL_ADMIN_EMAIL: ${LOCAL_ADMIN_EMAIL:-}
      LOCAL_ADMIN_PASSWORD: ${LOCAL_ADMIN_PASSWORD:-}
      LOCAL_ADMIN_DISPLAY_NAME: ${LOCAL_ADMIN_DISPLAY_NAME:-}
      LDAP_URL: ${LDAP_URL:-}
      LDAP_BASE_DN: ${LDAP_BASE_DN:-}
      LDAP_SEARCH_BASE: ${LDAP_SEARCH_BASE:-}
      LDAP_BIND_DN: ${LDAP_BIND_DN:-}
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD:-}
      LDAP_ALLOWED_GROUPS: ${LDAP_ALLOWED_GROUPS:-}
      LDAP_TLS_REJECT_UNAUTHORIZED: ${LDAP_TLS_REJECT_UNAUTHORIZED:-true}
      LDAP_TLS_CA_FILE: ${LDAP_TLS_CA_FILE:-}
      LDAP_TLS_CA_BASE64: ${LDAP_TLS_CA_BASE64:-}
      SHARED_FOLDER_PATH: ${SHARED_FOLDER_PATH:-/app/scanned_documents}
      CIFS_SHARE_PATH: ${CIFS_SHARE_PATH:-}
    volumes:
      - shared_cifs:${SHARED_FOLDER_PATH:-/app/scanned_documents}:rw
    ports:
      - ${BACKEND_PORT:-5005}:5005

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: .
    ports:
      - ${FRONTEND_PORT:-5058}:80
    depends_on:
      - backend

volumes:
  shared_cifs:
    driver: local
    driver_opts:
      type: cifs
      device: "${CIFS_SHARE_PATH:?CIFS_SHARE_PATH is required (example: //10.0.0.10/share)}"
      o: "username=${DOMAIN_USERNAME:?DOMAIN_USERNAME is required},password=${DOMAIN_PASSWORD:?DOMAIN_PASSWORD is required},vers=${CIFS_VERS:-3.0},rw,noperm,dir_mode=0777,file_mode=0777"
